[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-reference"
version = "0.2.0b1"
description = "Limited public beta of the synthetic-data-only ANVIL reference profile"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Titans Forge LLC"}
]

[project.urls]
Homepage = "https://github.com/Titans-Forge-LLC/anvil"
Repository = "https://github.com/Titans-Forge-LLC/anvil"
Issues = "https://github.com/Titans-Forge-LLC/anvil/issues"

[project.scripts]
anvil = "anvil_alpha.cli:main"
anvil-alpha = "anvil_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
