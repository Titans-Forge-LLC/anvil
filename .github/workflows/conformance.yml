name: Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify release and conformance
        env:
          PYTHONPATH: src
        run: python scripts/verify_release.py
      - name: Verify committed manifest is deterministic
        run: git diff --exit-code -- RELEASE_MANIFEST.json
      - name: Generate privacy-bounded test receipt
        env:
          PYTHONPATH: src
        run: python scripts/create_test_receipt.py --output anvil-test-receipt.json
